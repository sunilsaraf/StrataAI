version: "3.9"

# StrataAI – Full stack docker-compose
# Existing services: nginx, mgmt-api-python, iam-java, cassandra
# New AI Control Plane services: ai-interceptor, kafka, mcp-server, ai-agent-workers, redis

services:

  # ──────────────────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 72        # 3-day event retention
      KAFKA_COMPRESSION_TYPE: snappy
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["bash", "-c",
      "kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic ai-control-events --partitions 6 --replication-factor 1"
    ]
    restart: "no"

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: StrataAI
      CASSANDRA_DC: DC1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "DESCRIBE KEYSPACES"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra-schema:/schema
    entrypoint: ["bash", "/schema/init.sh", "cassandra"]
    restart: "no"

  # ──────────────────────────────────────────────────────────
  # Existing Control Plane (stubs – replace with real images)
  # ──────────────────────────────────────────────────────────

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    depends_on:
      - ai-interceptor
      - mgmt-api-python

  mgmt-api-python:
    image: strataai/mgmt-api:latest
    environment:
      CASSANDRA_HOSTS: cassandra
      IAM_SERVICE_URL: http://iam-service:8081
      AI_INTERCEPTOR_URL: http://ai-interceptor:8080
    depends_on:
      cassandra:
        condition: service_healthy

  iam-service:
    image: strataai/iam-java:latest
    environment:
      CASSANDRA_HOSTS: cassandra
    depends_on:
      cassandra:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────
  # AI Control Plane (new)
  # ──────────────────────────────────────────────────────────

  ai-interceptor:
    build: ./ai-interceptor
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ai-control-events
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SERVICE_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  mcp-server:
    build: ./mcp-server
    environment:
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_KEYSPACE_AUTH: strataai
      CASSANDRA_KEYSPACE_AI: ai_control
      IAM_SERVICE_URL: http://iam-service:8081
      LUSTRE_MOUNT: /lustre
      SAMPLE_MAX_BYTES: "65536"
      MCP_PORT: "8090"
      AUDIT_LOG_PATH: /var/log/mcp/audit.jsonl
    volumes:
      - mcp-audit-logs:/var/log/mcp
    ports:
      - "8090:8090"
    depends_on:
      cassandra:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  ai-agent-workers:
    build: ./agent-workers
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ai-control-events
      KAFKA_GROUP_ID: ai-agent-workers
      MCP_SERVER_URL: http://mcp-server:8090
      AGENT_VERSION: "1.0.0"
    depends_on:
      kafka:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mcp-audit-logs:
